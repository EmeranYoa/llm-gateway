services:
  gateway:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      # Edit config/gateway.yaml, then `docker compose restart gateway`: no rebuild needed.
      - ./config:/app/config:ro
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gateway}:${POSTGRES_PASSWORD:-gateway}@postgres:5432/${POSTGRES_DB:-gateway}
      # Number of gateway worker processes, read by uvicorn. About one per CPU core;
      # each one uses about 100 MB of RAM. Workers share their state through Redis.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 3

  # Admin API for the dashboard: the same code, in its own process.
  # No `ports:` on purpose: it is never published, only reachable on this network.
  admin-api:
    build: .
    command:
      [
        "uvicorn",
        "app.admin_api.main:create_admin_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
        # One process only: the one-time setup and recovery tokens and the
        # per-address sign-in limit live in its memory. Several workers would print
        # several setup tokens. This flag wins over WEB_CONCURRENCY from `.env`.
        "--workers",
        "1",
      ]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./config:/app/config:ro
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gateway}:${POSTGRES_PASSWORD:-gateway}@postgres:5432/${POSTGRES_DB:-gateway}
    depends_on:
      gateway:
        condition: service_healthy # the gateway brings the database schema up to date
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 3

  # Admin dashboard: open http://localhost:3000 and sign in with an admin key.
  # Its server calls the admin API on this network; the browser never sees the key.
  dashboard:
    build: ./dashboard
    ports:
      # Local machine only: the session cookie is `Secure`, so another machine
      # would need HTTPS in front of the dashboard anyway.
      - "127.0.0.1:3000:3000"
    environment:
      ADMIN_API_URL: http://admin-api:8001
      # Required, at least 32 characters: the dashboard refuses to start without it.
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET:-}
    depends_on:
      admin-api:
        condition: service_healthy

  redis:
    image: redis:8.8
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway}
      POSTGRES_DB: ${POSTGRES_DB:-gateway}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional local model, used as the last-resort target in config/gateway.yaml.
  # Start it with: docker compose --profile ollama up -d
  # Then download the model once: docker compose exec ollama ollama pull llama3.2:3b
  ollama:
    image: ollama/ollama:0.35.1
    profiles: [ollama]
    volumes:
      - ollama-data:/root/.ollama

volumes:
  postgres-data:
  ollama-data:

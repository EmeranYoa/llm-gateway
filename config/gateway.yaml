# Gateway configuration: providers, their models, and routes (aliases).
#
# Limits, timeout and daily_reset belong to the model or provider, never to a route.
# Free-tier limits below were checked on the providers' documentation on 2026-10-21.
# They change often: check them again before relying on them.

gateway:
  deadline: 60 # seconds, for the whole request including failovers
  default_completion_tokens: 512 # used to estimate tokens when max_tokens is missing
  cooldown: # seconds a target is skipped after some errors
    initial: 60 # after a 429 without retry delay; doubles on each 429 in a row
    max: 3600 # upper bound of that progressive cooldown
    misconfigured: 600 # after a 401, 403 or 404 (bad API key, removed model)
  breaker: # circuit breaker, per provider/model
    failures: 5 # 5xx, network errors or timeouts within the window that open it
    window: 60 # seconds
    open: 30 # seconds it stays open before a single trial call is let through
  stream: # streamed answers, after their first content (the deadline no longer applies)
    idle_timeout: 30 # longest silence allowed between two events of the provider
    max_duration: 600 # longest time a stream may last

tenants:
  # Quotas of each tenant (client application), on top of the provider limits.
  # A missing limit means "no limit". Override them per tenant with:
  #   python -m app.admin set-limits --tenant NAME [--rpm N] [--tokens-per-day N]
  default_limits:
    rpm: 60 # requests per minute, sliding 60 s window; failed requests count too
    tokens_per_day: 500000 # prompt + completion tokens, reset every day at 00:00 UTC

# Response cache: repeated or rephrased questions answered without calling a provider.
# To enable it, start Ollama and download the embedding model once:
#   docker compose --profile ollama up -d
#   docker compose exec ollama ollama pull nomic-embed-text
# then uncomment this section and restart the gateway.
# cache:
#   embedding: { provider: ollama, model: nomic-embed-text, timeout: 1 }
#   similarity_threshold: 0.95 # cosine similarity for a rephrased question to be a hit
#   ttl: 86400 # seconds an answer is kept
#   max_semantic_chars: 2000 # longer questions only get exact hits
#   max_entries_per_tenant: 10000
#   aliases: # only these aliases use the cache
#     chat-fast: {}

providers:
  # https://console.groq.com/docs/rate-limits (free plan)
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    # Groq documents no fixed daily reset time; its rate-limit headers and 429
    # responses drive the cooldown when this approximation is off.
    daily_reset: { time: "00:00", timezone: "UTC" }
    models:
      openai/gpt-oss-120b: { rpm: 30, tpm: 8000, rpd: 1000, timeout: 30 }
      openai/gpt-oss-20b: { rpm: 30, tpm: 8000, rpd: 1000, timeout: 30 }

  # https://ai.google.dev/gemini-api/docs/rate-limits
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    daily_reset: { time: "00:00", timezone: "America/Los_Angeles" } # midnight Pacific time
    models:
      # Google no longer publishes free-tier numbers: read the limits of your
      # project in Google AI Studio and put them here. These are conservative guesses.
      gemini-2.5-flash: { rpm: 10, rpd: 250 }

  # https://openrouter.ai/docs/api/reference/limits (":free" models)
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    daily_reset: { time: "00:00", timezone: "UTC" }
    models:
      # 50 requests per day for the whole account (1000 after buying 10 credits).
      "google/gemma-4-31b-it:free": { rpm: 20, rpd: 50 }

  # Optional local model: docker compose --profile ollama up -d
  # Without it, this target simply fails over.
  ollama:
    base_url: http://ollama:11434/v1
    api_key_env: null
    models:
      "llama3.2:3b": { timeout: 120 } # last resort, no limits

routes:
  chat-fast:
    [
      groq/openai/gpt-oss-20b,
      gemini/gemini-2.5-flash,
      openrouter/google/gemma-4-31b-it:free,
      ollama/llama3.2:3b,
    ]
  chat-smart:
    [
      groq/openai/gpt-oss-120b,
      gemini/gemini-2.5-flash,
      openrouter/google/gemma-4-31b-it:free,
      ollama/llama3.2:3b,
    ]
